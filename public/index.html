<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c81e2b" />
  <meta name="description" content="福彩双色球号码核对工具" />
  <title>福彩双色球号码核对器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">FC</div>
      <div class="header-copy">
        <p class="eyebrow">FULI CAIPIAO</p>
        <h1>福彩双色球号码核对器</h1>
        <p class="subtitle">最近期开奖与 5 组自选号码快速核对</p>
      </div>
    </header>

    <section class="toggle-bar" aria-label="开奖方式">
      <label class="custom-toggle">
        <input type="checkbox" id="useCustom" />
        <span class="toggle-track" aria-hidden="true"></span>
        <span class="toggle-copy">
          <strong>自定义开奖号码</strong>
          <small>手动填写本次开奖号码</small>
        </span>
      </label>
    </section>

    <fieldset class="panel">
      <legend><span class="step-number">01</span> 选择开奖期数</legend>
      <div class="field-group">
        <label class="field-label" for="comboDraws">最近 20 期官方开奖</label>
        <div class="select-action">
          <select id="comboDraws" aria-label="开奖期数"></select>
          <button id="btnRefresh" class="btn-secondary" type="button" title="刷新开奖数据">
            <span class="refresh-icon" aria-hidden="true">↻</span>
            <span>刷新</span>
          </button>
        </div>
      </div>
    </fieldset>

    <fieldset class="panel">
      <legend><span class="step-number">02</span> 开奖号码</legend>
      <div class="number-grid winning-grid">
        <div class="field-group red-field">
          <label class="field-label" for="winRed"><span class="ball ball-red" aria-hidden="true"></span>红球号码</label>
          <input type="text" id="winRed" placeholder="例如 01 02 03 04 05 06" inputmode="numeric" autocomplete="off" readonly />
        </div>
        <div class="field-group blue-field">
          <label class="field-label" for="winBlue"><span class="ball ball-blue" aria-hidden="true"></span>蓝球号码</label>
          <input type="text" id="winBlue" placeholder="例如 08" inputmode="numeric" autocomplete="off" readonly />
        </div>
      </div>
    </fieldset>

    <fieldset class="panel">
      <legend><span class="step-number">03</span> 5 组自选号码 <span class="legend-note">自动保存</span></legend>
      <div id="userRows" class="user-rows"></div>
    </fieldset>

    <button id="btnCheck" class="btn-primary" type="button">
      <span aria-hidden="true">✓</span>
      <span>提交核对</span>
    </button>

    <fieldset class="panel result-panel">
      <legend><span class="step-number">04</span> 核对结果</legend>
      <div id="result" class="result" aria-live="polite">
        <p class="result-empty">核对结果将在这里显示</p>
      </div>
    </fieldset>

    <footer class="rule-note">
      <strong>中奖规则</strong>
      <span>一等奖：6 红 + 1 蓝</span>
      <span>二等奖：6 红</span>
      <span>三等奖：5 红 + 1 蓝</span>
      <span>四等奖：5 红或 4 红 + 1 蓝</span>
      <span>五等奖：4 红或 3 红 + 1 蓝</span>
      <span>六等奖：不多于 2 红 + 1 蓝</span>
      <span>福运奖：3 红</span>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
